name: Temp patch voice screen timeout

on:
  push:
    branches:
      - fix/voice-screen-timeout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voice-screen-timeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch screen-analysis timeout only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/voice-core-v10.js')
          s = p.read_text(encoding='utf-8')
          old_const = "  const TOOL_TIMEOUT_MS = 12000;"
          new_const = "  const TOOL_TIMEOUT_MS = 12000;\n  const SCREEN_TOOL_TIMEOUT_MS = 22000;"
          if old_const not in s:
              raise SystemExit('TOOL_TIMEOUT_MS anchor not found')
          s = s.replace(old_const, new_const, 1)

          old_call = "        const result = await withTimeout(executeLiveTool(call), TOOL_TIMEOUT_MS, `TOOL_${String(call?.name || 'UNKNOWN').toUpperCase()}`);"
          new_call = "        const timeoutMs = String(call?.name || '') === 'pc_screen_analyze' ? SCREEN_TOOL_TIMEOUT_MS : TOOL_TIMEOUT_MS;\n        const result = await withTimeout(executeLiveTool(call), timeoutMs, `TOOL_${String(call?.name || 'UNKNOWN').toUpperCase()}`);"
          if old_call not in s:
              raise SystemExit('tool timeout call anchor not found')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/desktop-native-pairing.test.mjs')
          ts = t.read_text(encoding='utf-8')
          addition = '''\n\ntest('Voice Core dá janela maior apenas para análise de tela', () => {\n  const voice = read('public/voice-core-v10.js');\n  assert.match(voice, /const TOOL_TIMEOUT_MS = 12000;/);\n  assert.match(voice, /const SCREEN_TOOL_TIMEOUT_MS = 22000;/);\n  assert.match(voice, /pc_screen_analyze[^\\n]*SCREEN_TOOL_TIMEOUT_MS[^\\n]*TOOL_TIMEOUT_MS/);\n});\n'''
          if 'SCREEN_TOOL_TIMEOUT_MS = 22000' not in ts:
              t.write_text(ts.rstrip() + addition, encoding='utf-8')

          wf = Path('.github/workflows/temp-patch-voice-screen-timeout.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Validate patched Voice Core
        run: |
          node --check public/voice-core-v10.js
          node --test tests/desktop-native-pairing.test.mjs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(voice): ampliar timeout apenas da análise de tela"
          git push origin HEAD:fix/voice-screen-timeout
