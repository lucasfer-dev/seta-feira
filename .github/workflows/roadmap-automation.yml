    mission.summary = 'Retomada explicitamente pelo usuário.';
    await saveMission(mission);
    return runPcAgentTask({ goal:mission.goal, maxSteps:args.maxSteps }, options);
  }
  throw new Error('MISSION_TOOL_NOT_SUPPORTED');
}

