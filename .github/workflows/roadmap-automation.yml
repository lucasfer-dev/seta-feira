name: Build SEXTA Roadmap PR Stack

on:
  push:
    branches: [automation/roadmap-20260913]
    paths:
      - '.github/workflows/roadmap-automation.yml'
      - '.github/scripts/roadmap-automation.py'
      - '.github/scripts/run-roadmap-automation.py'

permissions:
  contents: write

jobs:
  build-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create focused implementation branches
        run: |
          git config user.name "sexta-roadmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          python .github/scripts/run-roadmap-automation.py
