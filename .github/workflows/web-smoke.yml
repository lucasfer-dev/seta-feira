name: Web Smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/web-smoke.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/web-smoke.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Voice Core v9
        run: node --check public/voice-core-v9.js
      - name: Check Voice Core v8 fallback
        run: node --check public/voice-core-v8.js
      - name: Check voice loader
        run: node --check public/voice-loader.js
      - name: Check live token endpoint
        run: node --check api/live-token.js
      - name: Assert Gemini 3.1 automatic VAD mode
        run: |
          grep -q "gemini-3.1-flash-live-preview" api/live-token.js
          grep -q "clientVersion:'v9'" public/voice-core-v9.js
          grep -q "vadMode:'automatic'" public/voice-core-v9.js
          if grep -q "audioStreamEnd:true" public/voice-core-v9.js; then
            echo "v9.2 must not send audioStreamEnd"
            exit 1
          fi
      - name: Check audio resampler
        run: node --check public/audio-resampler.js
      - name: Test audio resampler quality
        run: node tests/audio-resampler.test.mjs
      - name: Check SEXTA shell v2
        run: node --check public/sexta-shell-v2.js
      - name: Check audio worklet
        run: node --check public/live-input-worklet.js
      - name: Check app entry
        run: node --check public/app.js
      - name: Check health endpoint
        run: node --check api/health.js
