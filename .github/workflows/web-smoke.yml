name: Web Smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'api/**'
      - 'lib/**'
      - 'tests/**'
      - 'agent/**'
      - 'server.mjs'
      - 'apps/android-capacitor/**'
      - 'apps/desktop-electron/**'
      - '.github/workflows/web-smoke.yml'
      - '.github/workflows/desktop-smoke.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'api/**'
      - 'lib/**'
      - 'tests/**'
      - 'agent/**'
      - 'server.mjs'
      - 'apps/android-capacitor/**'
      - 'apps/desktop-electron/**'
      - '.github/workflows/web-smoke.yml'
      - '.github/workflows/desktop-smoke.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Voice Core v10
        run: node --check public/voice-core-v10.js
      - name: Check smart barge-in guard
        run: node --check public/voice-barge-in-guard.js
      - name: Check output jitter guard
        run: node --check public/voice-output-jitter-guard.js
      - name: Check presence and tool context
        run: |
          node --check public/presence-engine.js
          node --check public/presence-orb-lite.js
          node --check public/voice-tool-context.js
      - name: Check canonical personality
        run: node --check public/sexta-personality.js
      - name: Check voice loader
        run: node --check public/voice-loader.js
      - name: Check Tool Core
        run: |
          node --check lib/tool-policy.mjs
          node --check lib/mcp-client.mjs
          node --check lib/android-hands-tools.mjs
          node --check lib/pc-desktop-tools.mjs
          node --check lib/tool-core.mjs
          node --check lib/agent-auth.mjs
          node --check api/tool-execute.js
          node --check api/tool-registry.js
          node --check api/chat.js
          node --check api/pc-vision-analyze.js
          node --check api/agent-pair.js
          node --check api/agent-check.js
          node --check api/agent-control.js
      - name: Check cloud router
        run: |
          node --check server.mjs
          grep -q "'/api/tool-registry', toolRegistry" server.mjs
          grep -q "'/api/pc-vision-analyze', pcVisionAnalyze" server.mjs
          grep -q "'/api/agent-pair', agentPair" server.mjs
          grep -q "'/api/agent-check', agentCheck" server.mjs
          grep -q "'/api/agent-control', agentControl" server.mjs
      - name: Check PC Agent v3 modules
        run: |
          node --check agent/agent-v3.mjs
          node --check agent/runtime-state.mjs
          node --check agent/audit.mjs
          node --check agent/setup.mjs
          node --check agent/doctor.mjs
          node --check agent/update.mjs
          node --check agent/control-local.mjs
          node --check agent/windows-ui.mjs
          node --check agent/browser-agent.mjs
          node --check apps/desktop-electron/main.cjs
          node --check apps/desktop-electron/preload.cjs
      - name: Check SEXTA web HUD v3
        run: |
          node --check public/sexta-shell-v3.js
          grep -q "sexta-shell-v3.js" public/app.js
          grep -q "sexta-v3.css" public/styles.css
          grep -q "FIRST CONTACT" public/sexta-shell-v3.js
          grep -q "AUTONOMY LEVEL" public/sexta-shell-v3.js
      - name: Check Android Hands preparation
        run: node --check apps/android-capacitor/scripts/prepare-hands.mjs
      - name: Check live token endpoint
        run: node --check api/live-token.js
      - name: Assert deterministic Voice Core v10 contract
        run: |
          grep -q "gemini-3.1-flash-live-preview" api/live-token.js
          grep -q "clientVersion:'v10'" public/voice-core-v10.js
          grep -q "vadMode:'manual'" public/voice-core-v10.js
          grep -q "activityStart:{}" public/voice-core-v10.js
          grep -q "activityEnd:{}" public/voice-core-v10.js
          grep -q "voice-barge-in-guard.js" public/voice-loader.js
          grep -q "voice-output-jitter-guard.js" public/voice-loader.js
          grep -q "presence-engine.js" public/voice-loader.js
          grep -q "presence-orb-lite.js" public/voice-loader.js
          grep -q "voice-tool-context.js" public/voice-loader.js
          grep -q "START_SENSITIVITY_LOW" api/live-token.js
          grep -q "getLiveToolDeclarations" api/live-token.js
          grep -q "ANDROID_HANDS_TOOL_DECLARATIONS" lib/tool-core.mjs
          grep -q "PC_DESKTOP_TOOL_DECLARATIONS" lib/tool-core.mjs
          grep -q "pc_agent_task" lib/tool-core.mjs
          grep -q "2.0.0-ring-buffer" public/voice-output-jitter-guard.js
          grep -q "sexta-output-ring-buffer" public/live-output-worklet.js
          ! grep -Eq "voice-core-v[5-9]\\.js" public/voice-loader.js
      - name: Check audio resampler
        run: node --check public/audio-resampler.js
      - name: Test voice contracts and tool safety
        run: node --test tests/*.test.mjs
      - name: Check legacy shell syntax
        run: node --check public/sexta-shell-v2.js
      - name: Check audio worklets
        run: |
          node --check public/live-input-worklet.js
          node --check public/live-output-worklet.js
      - name: Check app entry
        run: node --check public/app.js
      - name: Check health endpoint
        run: node --check api/health.js
