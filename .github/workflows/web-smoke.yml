name: Web Smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/web-smoke.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/web-smoke.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Voice Core v7
        run: node --check public/voice-core-v7.js
      - name: Check Voice Core v6 fallback
        run: node --check public/voice-core-v6.js
      - name: Check voice loader
        run: node --check public/voice-loader.js
      - name: Check audio resampler
        run: node --check public/audio-resampler.js
      - name: Test audio resampler quality
        run: node tests/audio-resampler.test.mjs
      - name: Check SEXTA shell v2
        run: node --check public/sexta-shell-v2.js
      - name: Check audio worklet
        run: node --check public/live-input-worklet.js
      - name: Check app entry
        run: node --check public/app.js
      - name: Check health endpoint
        run: node --check api/health.js
