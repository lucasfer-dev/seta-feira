name: Harden Roadmap Routing and Missions

on:
  push:
    branches: [automation/roadmap-20260913]
    paths:
      - '.github/workflows/roadmap-fix-routing-missions.yml'
      - '.github/scripts/harden-routing-missions.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch stacked branches
        run: python .github/scripts/harden-routing-missions.py
