name: Build SEXTA Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'apps/desktop-electron/**'
      - '.github/workflows/desktop-release.yml'
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop-electron install
      - name: Build unsigned NSIS installer and update metadata
        run: npm --prefix apps/desktop-electron run dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEXTA-Windows-Installer
          path: |
            apps/desktop-electron/dist/*.exe
            apps/desktop-electron/dist/*.blockmap
            apps/desktop-electron/dist/latest.yml
          if-no-files-found: error
      - name: Publish desktop release for auto-update
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop-electron/dist/*.exe
            apps/desktop-electron/dist/*.blockmap
            apps/desktop-electron/dist/latest.yml
