name: Build SEXTA Desktop Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'apps/desktop-electron/**'
      - '.github/workflows/desktop-release.yml'
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop-electron install
      - name: Build NSIS installer and update metadata
        env:
          # electron-builder signs automatically when these optional repository secrets exist.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm --prefix apps/desktop-electron run dist
      - name: Scan SEXTA with Microsoft Defender
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'apps/desktop-electron/dist' -Filter '*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'SEXTA installer not found for Defender scan.' }

          $mpCandidates = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe",
            (Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'MpCmdRun.exe' })
          ) | Where-Object { $_ -and (Test-Path $_) }
          $mp = $mpCandidates | Select-Object -First 1
          if (-not $mp) {
            Write-Warning 'Microsoft Defender CLI unavailable on this runner; static Defender-safety contracts still run in Desktop Smoke.'
          } else {
            $started = Get-Date
            & $mp -Scan -ScanType 3 -File $installer.FullName -DisableRemediation
            $scanExit = $LASTEXITCODE
            if (-not (Test-Path $installer.FullName)) { throw 'Microsoft Defender removed/quarantined the SEXTA installer.' }

            $detections = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              $_.InitialDetectionTime -ge $started.AddMinutes(-2) -and (($_.Resources -join ' ') -match [regex]::Escape($installer.Name))
            })
            if ($detections.Count -gt 0) {
              $detections | Format-List * | Out-String | Write-Host
              throw 'Microsoft Defender detected the SEXTA installer.'
            }
            if ($scanExit -ne 0) { Write-Warning "Defender scanner exited with code $scanExit but reported no SEXTA detection." }
            Write-Host "Defender scan completed for $($installer.Name)"
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEXTA-Windows-Installer
          path: |
            apps/desktop-electron/dist/*.exe
            apps/desktop-electron/dist/*.blockmap
            apps/desktop-electron/dist/latest.yml
          if-no-files-found: error
      - name: Publish tagged desktop release for auto-update
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/desktop-electron/dist/*.exe
            apps/desktop-electron/dist/*.blockmap
            apps/desktop-electron/dist/latest.yml
      - name: Publish current desktop version from main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./apps/desktop-electron/package.json').version"
          $tag = "desktop-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Desktop code changed without a version bump; bump apps/desktop-electron/package.json before merging."
          }

          $assets = Get-ChildItem 'apps/desktop-electron/dist' -File | Where-Object {
            $_.Extension -eq '.exe' -or $_.Extension -eq '.blockmap' -or $_.Name -eq 'latest.yml'
          } | ForEach-Object { $_.FullName }
          if (-not $assets -or $assets.Count -lt 3) { throw 'Desktop update assets are incomplete.' }

          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "SEXTA Desktop v$version" `
            --generate-notes
