<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SEXTA • modo local</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#070b10;color:#e7f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#0c2630 0,#070b10 42%,#05070a 100%)}main{width:min(760px,calc(100% - 40px));padding:32px;border:1px solid #214653;background:#091118e8;box-shadow:0 24px 80px #0008}small{letter-spacing:.16em;color:#72d8ef}h1{font-size:34px;margin:10px 0 8px}p{color:#a9bcc5;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}button{border:1px solid #2b5967;background:#0d1b23;color:#dff9ff;padding:14px 16px;text-align:left;cursor:pointer}button:hover{background:#112631}.status{margin-top:18px;padding:12px;border-left:2px solid #64d6ef;background:#0a171d;color:#9ed8e6;font-family:Consolas,monospace;white-space:pre-wrap}@media(max-width:620px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <small>SEXTA // LOCAL FALLBACK</small>
  <h1>A cloud não respondeu.</h1>
  <p>O corpo local continua disponível para diagnóstico. Este modo não tenta substituir o cérebro cloud nem executa automação arbitrária; ele serve para recuperar conexão, Agent e setup.</p>
  <div class="grid">
    <button id="retry">↻ Tentar cloud novamente</button>
    <button id="restart">⟳ Reiniciar PC Agent</button>
    <button id="setup">⚙ Abrir setup do Agent</button>
    <button id="status">⌁ Ver status local</button>
  </div>
  <div class="status" id="out">Aguardando ação.</div>
</main>
<script>
  const out=document.getElementById('out');
  const run=async(name,fn)=>{try{out.textContent=name+'...';const r=await fn();out.textContent=JSON.stringify(r,null,2)}catch(e){out.textContent=String(e?.message||e)}};
  document.getElementById('retry').onclick=()=>run('Reconectando',()=>window.sextaDesktop?.system?.retryCloud?.());
  document.getElementById('restart').onclick=()=>run('Reiniciando Agent',()=>window.sextaDesktop?.system?.restartAgent?.());
  document.getElementById('setup').onclick=()=>run('Abrindo setup',()=>window.sextaDesktop?.system?.setupAgent?.());
  document.getElementById('status').onclick=()=>run('Lendo status',()=>window.sextaDesktop?.system?.status?.());
</script>
</body>
</html>
