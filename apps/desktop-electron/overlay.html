<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SEXTA Presence</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#eef9fc}
  body{--cyan:#8deaff;--amber:#ffb65b;--muted:rgba(224,242,247,.56);--dim:rgba(224,242,247,.34)}
  button,input{font:inherit}
  .shell{width:100%;height:100%;border:1px solid rgba(141,234,255,.14);background:linear-gradient(145deg,rgba(7,12,18,.96),rgba(5,9,14,.92));backdrop-filter:blur(22px);box-shadow:0 16px 42px rgba(0,0,0,.38),inset 0 0 28px rgba(141,234,255,.018);overflow:hidden}
  body[data-mode="compact"] .shell{border-radius:20px}
  body[data-mode="expanded"] .shell{border-radius:22px}
  .compact{height:100%;display:flex;align-items:center;gap:12px;padding:9px 13px;cursor:pointer;user-select:none}
  body[data-mode="expanded"] .compact{display:none}
  .orb{position:relative;width:42px;height:42px;min-width:42px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(141,234,255,.26);box-shadow:0 0 24px rgba(73,191,220,.14),inset 0 0 18px rgba(0,0,0,.65)}
  .orb:before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px dashed rgba(141,234,255,.14)}
  .eye{width:52%;height:8%;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px rgba(141,234,255,.88),0 0 18px rgba(141,234,255,.26);transition:.16s ease}
  .text{min-width:0;flex:1}.name{display:flex;align-items:center;gap:7px;font:700 9px/1 "Courier New",monospace;letter-spacing:.18em;color:rgba(224,242,247,.42)}
  .name i{width:5px;height:5px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 8px rgba(110,231,183,.6)}
  .state{font-size:13px;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:9px;color:rgba(224,242,247,.38);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hotkey{margin-left:auto;padding:5px 7px;border:1px solid rgba(255,255,255,.07);border-radius:7px;color:var(--dim);font:700 8px/1 "Courier New",monospace;white-space:nowrap}
  .palette{display:none;height:100%;padding:14px}
  body[data-mode="expanded"] .palette{display:flex;flex-direction:column}
  .palette-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .identity{display:flex;align-items:center;gap:10px}.mini-orb{width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(141,234,255,.22);border-radius:50%;box-shadow:0 0 18px rgba(73,191,220,.09)}.mini-orb i{width:14px;height:2px;border-radius:3px;background:var(--cyan);box-shadow:0 0 8px rgba(141,234,255,.65)}
  .identity strong{display:block;font:700 10px/1 "Courier New",monospace;letter-spacing:.19em}.identity small{display:block;margin-top:5px;color:var(--dim);font-size:9px}
  .head-actions{display:flex;gap:6px}.head-actions button{height:31px;padding:0 10px;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.02);color:var(--muted);cursor:pointer;font-size:10px}.head-actions button:hover{border-color:rgba(141,234,255,.2);color:#fff}
  .command-row{height:54px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:0 11px;border:1px solid rgba(141,234,255,.13);border-radius:14px;background:rgba(141,234,255,.025)}
  .command-row span{color:var(--cyan);font-size:16px}.command-row input{width:100%;border:0;outline:0;background:transparent;color:#eef9fc;font-size:14px}.command-row input::placeholder{color:var(--dim)}.command-row kbd{padding:5px 6px;border:1px solid rgba(255,255,255,.07);border-radius:6px;color:var(--dim);font:700 8px/1 "Courier New",monospace}
  .quick-label{margin:13px 3px 7px;color:var(--dim);font:700 8px/1 "Courier New",monospace;letter-spacing:.16em}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.quick-grid button{min-height:48px;padding:8px 10px;border:1px solid rgba(255,255,255,.055);border-radius:11px;background:rgba(255,255,255,.018);color:#eaf8fb;text-align:left;cursor:pointer}.quick-grid button:hover{border-color:rgba(141,234,255,.2);background:rgba(141,234,255,.035)}.quick-grid strong{display:block;font-size:10px}.quick-grid small{display:block;margin-top:4px;color:var(--dim);font-size:8px}
  .palette-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:11px;color:var(--dim);font-size:8px}.palette-foot div{display:flex;gap:12px}.palette-foot b{color:var(--cyan);font-weight:600}
  body[data-state="listening"] .orb,body[data-state="user_speaking"] .orb{box-shadow:0 0 30px rgba(73,191,220,.28),inset 0 0 18px rgba(0,0,0,.65)}
  body[data-state="user_speaking"] .eye{width:68%;height:12%}
  body[data-state="thinking"] .orb:before{animation:spin 1.2s linear infinite;border-color:rgba(141,234,255,.35)}
  body[data-state="speaking"] .eye{animation:pulse .6s ease-in-out infinite alternate}
  body[data-state="acting"] .shell,body[data-state="tool"] .shell{border-color:rgba(255,182,91,.25)}
  body[data-state="acting"] .orb,body[data-state="tool"] .orb{border-color:rgba(255,182,91,.4);box-shadow:0 0 26px rgba(255,182,91,.16)}
  body[data-state="acting"] .eye,body[data-state="tool"] .eye{background:var(--amber);box-shadow:0 0 10px rgba(255,182,91,.6)}
  body[data-state="reconnecting"] .orb:before,body[data-state="recovering"] .orb:before{animation:spin .9s linear infinite}
  body[data-state="error"] .shell{border-color:rgba(255,113,107,.3)}
  body[data-state="error"] .eye{background:#ff716b;box-shadow:0 0 10px rgba(255,113,107,.6)}
  @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{to{transform:scaleX(1.22);opacity:.7}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-state="standby" data-mode="compact">
  <div class="shell">
    <div class="compact" id="compact" role="button" tabindex="0" aria-label="Abrir comandos rápidos da SEXTA">
      <div class="orb"><div class="eye"></div></div>
      <div class="text"><div class="name"><i></i>SEXTA / PRESENCE</div><div class="state" id="state">Pronta</div><div class="sub" id="sub">Clique para comandar</div></div>
      <div class="hotkey" id="compactHotkey">CTRL ⇧ SPACE</div>
    </div>

    <section class="palette" aria-label="Comandos rápidos da SEXTA">
      <header class="palette-head">
        <div class="identity"><div class="mini-orb"><i></i></div><div><strong>SEXTA</strong><small id="paletteState">Pronta para agir.</small></div></div>
        <div class="head-actions"><button type="button" id="voiceBtn">VOZ</button><button type="button" id="openMainBtn">ABRIR</button><button type="button" id="closeBtn">×</button></div>
      </header>

      <label class="command-row"><span>⌘</span><input id="commandInput" autocomplete="off" spellcheck="false" placeholder="Fala ou digita o que você quer..." /><kbd>ENTER</kbd></label>

      <div class="quick-label">AÇÕES IMEDIATAS</div>
      <div class="quick-grid">
        <button type="button" data-command="Sexta, olha minha tela e me diz o que está acontecendo."><strong>Olhar tela</strong><small>Vision + contexto atual</small></button>
        <button type="button" data-command="Sexta, o que você lembra sobre o que estamos fazendo agora?"><strong>Contexto</strong><small>Retomar projeto atual</small></button>
        <button type="button" data-command="Sexta, organiza o que eu devo fazer agora com base no nosso contexto."><strong>Organizar</strong><small>Próximos passos</small></button>
        <button type="button" data-command="Sexta, me diga o status do meu computador."><strong>Status do PC</strong><small>Agente e sistema</small></button>
      </div>

      <footer class="palette-foot"><div><span><b id="paletteShortcut">Ctrl+Shift+Space</b> comandos</span><span><b id="voiceShortcut">Ctrl+Alt+Space</b> voz</span></div><span>ESC fechar</span></footer>
    </section>
  </div>
<script>
(() => {
  const labels={standby:'Pronta',off:'Pronta',connecting:'Conectando…',listening:'Ouvindo…',user_speaking:'Ouvindo você…',thinking:'Pensando…',speaking:'Respondendo…',acting:'Executando…',tool:'Executando…',reconnecting:'Reconectando…',recovering:'Reconectando…',error:'Atenção necessária'};
  const desktop=window.sextaDesktop; const habitat=desktop?.habitat;
  const stateEl=document.querySelector('#state'); const sub=document.querySelector('#sub'); const paletteState=document.querySelector('#paletteState'); const input=document.querySelector('#commandInput');

  function prettyShortcut(value,fallback){return String(value||fallback).replace('CommandOrControl','Ctrl').replaceAll('+',' + ')}
  function renderShortcuts(shortcuts={}){document.querySelector('#compactHotkey').textContent=prettyShortcut(shortcuts.palette,'Ctrl+Shift+Space').replaceAll(' + ',' ');document.querySelector('#paletteShortcut').textContent=prettyShortcut(shortcuts.palette,'Ctrl+Shift+Space');document.querySelector('#voiceShortcut').textContent=prettyShortcut(shortcuts.voice,'Ctrl+Alt+Space');}
  function setMode(detail={}){const mode=detail.mode==='expanded'?'expanded':'compact';document.body.dataset.mode=mode;renderShortcuts(detail.shortcuts||{});if(mode==='expanded')setTimeout(()=>{input?.focus();input?.select();},20);}
  function submit(text){const value=String(text||input?.value||'').trim();if(!value)return;habitat?.command?.(value);if(input)input.value='';}

  desktop?.presence?.onUpdate?.(detail=>{const state=String(detail?.state||'standby');document.body.dataset.state=state;const label=labels[state]||state;stateEl.textContent=label;paletteState.textContent=detail?.tool?`Executando ${String(detail.tool).replace(/^pc_|^android_/,'').replaceAll('_',' ')}`:label;sub.textContent=detail?.tool?String(detail.tool).replace(/^pc_|^android_/,'').replaceAll('_',' '):'Clique para comandar';});
  habitat?.onMode?.(setMode);
  habitat?.status?.().then(status=>renderShortcuts(status?.shortcuts||{})).catch(()=>{});

  const expand=()=>habitat?.togglePalette?.();
  document.querySelector('#compact')?.addEventListener('click',expand);
  document.querySelector('#compact')?.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();expand();}});
  document.querySelector('#closeBtn')?.addEventListener('click',()=>habitat?.collapse?.());
  document.querySelector('#openMainBtn')?.addEventListener('click',()=>habitat?.openMain?.());
  document.querySelector('#voiceBtn')?.addEventListener('click',()=>habitat?.toggleVoice?.());
  document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',()=>submit(button.dataset.command)));
  input?.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();submit();}else if(event.key==='Escape'){event.preventDefault();habitat?.collapse?.();}});
  window.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();habitat?.collapse?.();}});
})();
</script>
</body>
</html>
